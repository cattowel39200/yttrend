<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 연관 키워드 탐색기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #888;
            font-size: 1rem;
        }

        .api-key-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .api-key-section label {
            color: #888;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .api-key-section input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 0.9rem;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: #888;
        }

        .filter-group select,
        .filter-group input {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .filter-group select option {
            background: #1a1a1a;
            color: #fff;
        }

        .search-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-section label {
            display: block;
            font-size: 0.85rem;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px 20px;
            color: #fff;
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .search-box button {
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .related-keywords {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .related-keywords .keyword-tag {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .related-keywords .keyword-tag:hover {
            background: #ff6b6b;
            border-color: #ff6b6b;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .results-header h2 {
            font-size: 1.2rem;
        }

        .results-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .results-count {
            color: #888;
            font-size: 0.9rem;
        }

        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f9d58;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: #0b8043;
        }

        /* 트렌드 추천 섹션 */
        .trend-recommend {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .trend-recommend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .trend-recommend-header h3 {
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trend-recommend-header .refresh-btn {
            background: #333;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trend-recommend-header .refresh-btn:hover {
            background: #444;
            color: #fff;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: #222;
            border-radius: 10px;
            padding: 15px;
            border-left: 3px solid #ff6b6b;
        }

        .category-card.entertainment { border-left-color: #ff6b6b; }
        .category-card.music { border-left-color: #feca57; }
        .category-card.gaming { border-left-color: #48dbfb; }
        .category-card.news { border-left-color: #1dd1a1; }
        .category-card.sports { border-left-color: #ff9f43; }
        .category-card.education { border-left-color: #a29bfe; }
        .category-card.tech { border-left-color: #74b9ff; }
        .category-card.lifestyle { border-left-color: #fd79a8; }

        .category-card h4 {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .category-keywords .keyword {
            background: #333;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-keywords .keyword:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .trend-loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        /* 키워드 분석 섹션 */
        .keyword-analysis {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .keyword-analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .keyword-analysis-header h3 {
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .keyword-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #222;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        .stat-card.competition-low .stat-value { color: #1dd1a1; }
        .stat-card.competition-medium .stat-value { color: #feca57; }
        .stat-card.competition-high .stat-value { color: #ff6b6b; }

        .competition-meter {
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .competition-meter .meter-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .competition-meter .meter-fill.low { background: linear-gradient(90deg, #1dd1a1, #10ac84); }
        .competition-meter .meter-fill.medium { background: linear-gradient(90deg, #feca57, #f0b429); }
        .competition-meter .meter-fill.high { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); }

        /* 연관 키워드 분석 */
        .related-analysis {
            margin-top: 20px;
        }

        .related-analysis h4 {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .keyword-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .keyword-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .keyword-item:hover {
            background: #333;
            transform: translateX(5px);
        }

        .keyword-item .keyword-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .keyword-item .keyword-name {
            color: #fff;
            font-size: 0.9rem;
        }

        .keyword-item .keyword-type {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: #444;
            color: #aaa;
        }

        .keyword-item .keyword-type.longtail {
            background: #2d4a3e;
            color: #1dd1a1;
        }

        .keyword-item .keyword-stats-mini {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        .keyword-item .competition-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .keyword-item .competition-badge.low {
            background: rgba(29, 209, 161, 0.2);
            color: #1dd1a1;
        }

        .keyword-item .competition-badge.medium {
            background: rgba(254, 202, 87, 0.2);
            color: #feca57;
        }

        .keyword-item .competition-badge.high {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .longtail-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .longtail-section h4 {
            font-size: 0.9rem;
            color: #1dd1a1;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .longtail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .longtail-tag {
            background: #2d4a3e;
            color: #1dd1a1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .longtail-tag:hover {
            background: #1dd1a1;
            color: #000;
        }

        .longtail-tag .tag-score {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 8px;
        }

        /* 복사 버튼 */
        .copy-btn {
            background: #444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #666;
        }

        .copy-btn.copied {
            background: #0f9d58;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        /* 테이블 스타일 */
        .video-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .video-table thead {
            background: #252525;
        }

        .video-table th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            color: #aaa;
            border-bottom: 2px solid #333;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .video-table th:hover {
            background: #333;
        }

        .video-table th.sortable::after {
            content: ' ↕';
            color: #555;
            font-size: 0.8rem;
        }

        .video-table th.sort-asc::after {
            content: ' ↑';
            color: #ff6b6b;
        }

        .video-table th.sort-desc::after {
            content: ' ↓';
            color: #ff6b6b;
        }

        .video-table tbody tr {
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.2s;
        }

        .video-table tbody tr:hover {
            background: #252525;
        }

        .video-table td {
            padding: 12px 10px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .video-table .thumbnail-cell {
            width: 100px;
        }

        .video-table .thumbnail {
            width: 100px;
            height: 75px;
            border-radius: 6px;
            object-fit: cover;
        }

        .video-table .title-cell {
            max-width: 300px;
        }

        .video-table .title-cell a {
            color: #fff;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .video-table .title-cell a:hover {
            color: #ff6b6b;
        }

        .video-table .channel-cell {
            color: #feca57;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-table .subscribers-cell {
            color: #48dbfb;
            white-space: nowrap;
        }

        .video-table .views-cell {
            color: #ff6b6b;
            white-space: nowrap;
        }

        .video-table .duration-cell {
            white-space: nowrap;
        }

        .video-table .date-cell {
            white-space: nowrap;
            color: #888;
        }

        .video-table .link-cell {
            text-align: center;
        }

        .video-table .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ff0000;
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .video-table .link-btn:hover {
            background: #cc0000;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error-message {
            background: #3d1f1f;
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        /* 트렌드 차트 스타일 */
        .trend-chart {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .trend-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .trend-chart-header h3 {
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trend-chart-header .info {
            font-size: 0.8rem;
            color: #888;
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 150px;
            padding: 10px 0;
            overflow-x: auto;
        }

        .chart-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 30px;
            max-width: 60px;
            height: 100%;
        }

        .chart-bar {
            width: 100%;
            background: linear-gradient(180deg, #ff6b6b, #ee5a5a);
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .chart-bar:hover {
            background: linear-gradient(180deg, #feca57, #f0b429);
            transform: scaleX(1.1);
        }

        .chart-bar .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            z-index: 100;
            pointer-events: none;
            margin-bottom: 5px;
        }

        .chart-bar .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #333;
        }

        .chart-bar:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .chart-label {
            font-size: 0.65rem;
            color: #888;
            text-align: center;
            margin-top: 5px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .chart-label:hover {
            color: #ff6b6b;
        }

        .chart-score {
            font-size: 0.7rem;
            color: #feca57;
            font-weight: 600;
            margin-top: 2px;
        }

        .chart-y-axis {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 150px;
            padding-right: 10px;
            font-size: 0.7rem;
            color: #666;
        }

        .chart-wrapper {
            display: flex;
            width: 100%;
        }

        .chart-bars-area {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 150px;
            border-left: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 0 10px 0 10px;
            overflow-x: auto;
        }

        /* 프로그레스바 */
        .progress-container {
            background: #222;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-label {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }

        /* 검색 히스토리 */
        .history-section {
            margin-top: 15px;
            display: none;
        }

        .history-section h5 {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-tag {
            background: #252525;
            color: #888;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-tag:hover {
            background: #333;
            color: #fff;
        }

        /* 즐겨찾기 섹션 */
        .favorites-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .favorites-header h3 {
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .favorite-card {
            background: #222;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            transition: all 0.2s;
        }

        .favorite-card:hover {
            background: #2a2a2a;
            transform: translateY(-2px);
        }

        .favorite-card img {
            width: 60px;
            height: 45px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
        }

        .favorite-info {
            flex: 1;
            overflow: hidden;

    <script>
        // 전역 변수
        let currentVideos = [];
        let channelSubscribersMap = {};
        let currentSort = { column: null, direction: 'asc' };

        // ========== 성능 최적화: 캐싱 시스템 ==========
        const apiCache = new Map();
        const CACHE_DURATION = 5 * 60 * 1000; // 5분 캐시

        function getCacheKey(endpoint, params) {
            return `${endpoint}:${JSON.stringify(params)}`;
        }

        function getFromCache(key) {
            const cached = apiCache.get(key);
            if (cached && Date.now() - cached.timestamp < CACHE_DURATION) {
                return cached.data;
            }
            apiCache.delete(key);
            return null;
        }

        function setToCache(key, data) {
            apiCache.set(key, { data, timestamp: Date.now() });
        }

        // 디바운스 함수
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ========== 검색 히스토리 & 즐겨찾기 ==========
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        function addToHistory(keyword) {
            searchHistory = searchHistory.filter(k => k !== keyword);
            searchHistory.unshift(keyword);
            searchHistory = searchHistory.slice(0, 20); // 최대 20개
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
            renderHistory();
        }

        function addToFavorites(video) {
            const exists = favorites.find(f => f.id === video.id);
            if (!exists) {
                favorites.unshift({
                    id: video.id,
                    title: video.snippet.title,
                    channel: video.snippet.channelTitle,
                    thumbnail: video.snippet.thumbnails.default?.url,
                    addedAt: Date.now()
                });
                favorites = favorites.slice(0, 50); // 최대 50개
                localStorage.setItem('favorites', JSON.stringify(favorites));
                return true;
            }
            return false;
        }

        function removeFromFavorites(videoId) {
            favorites = favorites.filter(f => f.id !== videoId);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (!container || searchHistory.length === 0) return;

            container.innerHTML = searchHistory.slice(0, 8).map(kw =>
                `<span class="history-tag" onclick="searchWithKeyword('${kw}')">${kw}</span>`
            ).join('');
            container.parentElement.style.display = 'block';
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesGrid');
            const section = document.getElementById('favoritesSection');
            if (!container) return;

            if (favorites.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = favorites.slice(0, 8).map(fav => `
                <div class="favorite-card">
                    <img src="${fav.thumbnail}" alt="${fav.title}" onclick="window.open('https://www.youtube.com/watch?v=${fav.id}', '_blank')">
                    <div class="favorite-info">
                        <div class="favorite-title" title="${fav.title}">${fav.title.substring(0, 30)}${fav.title.length > 30 ? '...' : ''}</div>
                        <div class="favorite-channel">${fav.channel}</div>
                    </div>
                    <button class="favorite-remove" onclick="removeFromFavorites('${fav.id}')" title="삭제">×</button>
                </div>
            `).join('');
        }

        // YouTube 카테고리 매핑
        const categoryMap = {
            '1': { name: '영화/애니메이션', class: 'entertainment', icon: '🎬' },
            '2': { name: '자동차', class: 'tech', icon: '🚗' },
            '10': { name: '음악', class: 'music', icon: '🎵' },
            '15': { name: '반려동물', class: 'lifestyle', icon: '🐾' },
            '17': { name: '스포츠', class: 'sports', icon: '⚽' },
            '20': { name: '게임', class: 'gaming', icon: '🎮' },
            '22': { name: '일상/브이로그', class: 'lifestyle', icon: '📷' },
            '23': { name: '코미디', class: 'entertainment', icon: '😂' },
            '24': { name: '엔터테인먼트', class: 'entertainment', icon: '🎭' },
            '25': { name: '뉴스/정치', class: 'news', icon: '📰' },
            '26': { name: '노하우/스타일', class: 'lifestyle', icon: '💄' },
            '27': { name: '교육', class: 'education', icon: '📚' },
            '28': { name: '과학기술', class: 'tech', icon: '🔬' }
        };

        // 트렌드 키워드 로드
        async function loadTrendKeywords() {
            const categoryGrid = document.getElementById('categoryGrid');
            categoryGrid.innerHTML = '<div class="trend-loading">트렌드 키워드 로딩 중...</div>';

            try {
                const apiKey = document.getElementById('apiKey').value.trim();
                if (!apiKey) {
                    categoryGrid.innerHTML = '<div class="trend-loading">API 키가 필요합니다.</div>';
                    return;
                }

                // 선택된 국가 코드 가져오기
                const regionCode = document.getElementById('regionCode').value;

                // 인기 동영상 가져오기
                const response = await fetchYouTubeAPI('videos', {
                    part: 'snippet',
                    chart: 'mostPopular',
                    regionCode: regionCode,
                    maxResults: 50
                });

                // 카테고리별로 그룹화 및 키워드 추출
                const categoryKeywords = {};

                response.items.forEach(video => {
                    const catId = video.snippet.categoryId;
                    const catInfo = categoryMap[catId] || { name: '기타', class: 'entertainment', icon: '📺' };

                    if (!categoryKeywords[catId]) {
                        categoryKeywords[catId] = {
                            ...catInfo,
                            keywords: []
                        };
                    }

                    // 제목에서 키워드 추출
                    const title = video.snippet.title;
                    const keywords = extractKeywords(title);
                    categoryKeywords[catId].keywords.push(...keywords);
                });

                // 카테고리별 상위 키워드 선정
                const categoryCards = Object.entries(categoryKeywords)
                    .filter(([_, cat]) => cat.keywords.length > 0)
                    .slice(0, 8)
                    .map(([catId, cat]) => {
                        const topKeywords = getTopKeywords(cat.keywords, 6);
                        return `
                            <div class="category-card ${cat.class}">
                                <h4>${cat.icon} ${cat.name}</h4>
                                <div class="category-keywords">
                                    ${topKeywords.map(kw =>
                                        `<span class="keyword" onclick="searchWithKeyword('${kw}')">${kw}</span>`
                                    ).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');

                categoryGrid.innerHTML = categoryCards || '<div class="trend-loading">트렌드 데이터를 불러올 수 없습니다.</div>';

            } catch (error) {
                categoryGrid.innerHTML = `<div class="trend-loading">오류: ${error.message}</div>`;
            }
        }

        // 키워드 추출 함수
        function extractKeywords(title) {
            // 특수문자 제거 및 단어 분리
            const cleaned = title
                .replace(/[^\w\s가-힣]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            // 2글자 이상 단어만 추출
            const words = cleaned.split(' ').filter(word => {
                return word.length >= 2 &&
                       !/^\d+$/.test(word) &&
                       !['the', 'and', 'for', 'with', 'this', 'that', 'from'].includes(word.toLowerCase());
            });

            return words.slice(0, 3);
        }

        // 상위 키워드 추출
        function getTopKeywords(keywords, count) {
            const freq = {};
            keywords.forEach(kw => {
                const lower = kw.toLowerCase();
                freq[lower] = (freq[lower] || 0) + 1;
            });

            return Object.entries(freq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, count)
                .map(([kw]) => kw);
        }

        // YouTube API 호출 함수 (캐싱 적용)
        async function fetchYouTubeAPI(endpoint, params, useCache = true) {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                throw new Error('API 키를 입력해주세요.');
            }

            // 캐시 확인
            const cacheKey = getCacheKey(endpoint, params);
            if (useCache) {
                const cached = getFromCache(cacheKey);
                if (cached) {
                    console.log('Cache hit:', endpoint);
                    return cached;
                }
            }

            const url = new URL(`https://www.googleapis.com/youtube/v3/${endpoint}`);
            params.key = apiKey;
            Object.entries(params).forEach(([key, value]) => {
                if (value !== undefined && value !== null) {
                    url.searchParams.append(key, value);
                }
            });

            const response = await fetch(url);
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API 요청 실패');
            }

            const data = await response.json();

            // 캐시에 저장
            if (useCache) {
                setToCache(cacheKey, data);
            }

            return data;
        }

        // 병렬 API 호출
        async function fetchParallel(requests) {
            return Promise.all(requests.map(req => fetchYouTubeAPI(req.endpoint, req.params)));
        }

        // 연관 키워드 조회 및 분석

            try {

                displayRelatedKeywords(suggestions.slice(0, 8));

                // 키워드 분석 실행
                await analyzeKeywords(keyword, suggestions);

        // 실제 검색 결과에서 연관 키워드 추출
        async function getYouTubeSuggestions(keyword) {
            const regionCode = document.getElementById('regionCode').value;

            try {
                // 검색 결과에서 영상 제목 가져오기
                const searchResult = await fetchYouTubeAPI('search', {
                    part: 'snippet',
                    q: keyword,
                    type: 'video',
                    maxResults: 25,
                    regionCode: regionCode
                });

                if (!searchResult.items || searchResult.items.length === 0) {
                    return [keyword];
                }

                // 비디오 ID로 태그 정보 가져오기
                const videoIds = searchResult.items.map(item => item.id.videoId).join(',');
                const videoDetails = await fetchYouTubeAPI('videos', {
                    part: 'snippet',
                    id: videoIds
                });

                // 제목과 태그에서 키워드 추출
                const allKeywords = [];

                videoDetails.items.forEach(video => {
                    // 제목에서 키워드 추출
                    const titleKeywords = extractKeywordsFromTitle(video.snippet.title, keyword);
                    allKeywords.push(...titleKeywords);

                    // 태그에서 키워드 추출 (있는 경우)
                    if (video.snippet.tags) {
                        const relevantTags = video.snippet.tags.filter(tag => {
                            const lowerTag = tag.toLowerCase();
                            const lowerKeyword = keyword.toLowerCase();
                            // 원본 키워드 포함하거나 관련성 있는 태그
                            return lowerTag.includes(lowerKeyword) ||
                                   lowerKeyword.includes(lowerTag) ||
                                   tag.length >= 2;
                        }).slice(0, 5);
                        allKeywords.push(...relevantTags);
                    }
                });

                // 빈도수 계산 및 정렬
                const keywordFreq = {};
                allKeywords.forEach(kw => {
                    const normalized = kw.toLowerCase().trim();
                    if (normalized.length >= 2 && normalized !== keyword.toLowerCase()) {
                        keywordFreq[normalized] = (keywordFreq[normalized] || 0) + 1;
                    }
                });

                // 빈도순 정렬 후 상위 키워드 반환
                const sortedKeywords = Object.entries(keywordFreq)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 15)
                    .map(([kw]) => kw);

                // 원본 키워드를 맨 앞에 추가
                return [keyword, ...sortedKeywords];

            } catch (error) {
                console.error('연관 키워드 추출 실패:', error);
                return [keyword];
            }
        }

        // 제목에서 의미 있는 키워드 추출
        function extractKeywordsFromTitle(title, originalKeyword) {
            const keywords = [];
            const lowerOriginal = originalKeyword.toLowerCase();

            // 특수문자 정리 및 단어 분리
            const cleaned = title
                .replace(/[\[\]【】\(\)「」『』\|\/\\·•→←↑↓]/g, ' ')
                .replace(/[^\w\s가-힣a-zA-Z0-9]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            // 불용어 목록
            const stopWords = new Set([
                'the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by',
                'this', 'that', 'these', 'those', 'is', 'are', 'was', 'were', 'be', 'been', 'being',
                'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should',
                'i', 'you', 'he', 'she', 'it', 'we', 'they', 'my', 'your', 'his', 'her', 'its', 'our', 'their',
                'vs', 'ep', 'episode', 'part', 'vol', 'chapter',
                '그', '이', '저', '것', '수', '등', '더', '및', '또', '의', '를', '을', '에', '가', '은', '는'
            ]);

            // 단어 분리
            const words = cleaned.split(' ');

            // 2-4단어 조합으로 구문 추출
            for (let i = 0; i < words.length; i++) {
                // 단일 단어 (2글자 이상)
                if (words[i].length >= 2 && !stopWords.has(words[i].toLowerCase())) {
                    keywords.push(words[i]);
                }

                // 2단어 조합
                if (i < words.length - 1) {
                    const twoWords = `${words[i]} ${words[i+1]}`;
                    if (twoWords.length >= 4 && !stopWords.has(words[i].toLowerCase())) {
                        keywords.push(twoWords);
                    }
                }

                // 3단어 조합 (원본 키워드 포함 시)
                if (i < words.length - 2) {
                    const threeWords = `${words[i]} ${words[i+1]} ${words[i+2]}`;
                    if (threeWords.toLowerCase().includes(lowerOriginal) ||
                        lowerOriginal.includes(words[i].toLowerCase())) {
                        keywords.push(threeWords);
                    }
                }
            }

            return keywords.filter(kw => kw.length >= 2);
        }

        // 키워드 경쟁 강도 분석
        async function analyzeKeywordCompetition(keyword) {
            try {
                const regionCode = document.getElementById('regionCode').value;

                // 해당 키워드로 검색해서 결과 수와 평균 조회수 파악
                const searchResult = await fetchYouTubeAPI('search', {
                    part: 'snippet',
                    q: keyword,
                    type: 'video',
                    maxResults: 10,
                    regionCode: regionCode
                });

                if (!searchResult.items || searchResult.items.length === 0) {
                    return { videoCount: 0, avgViews: 0, avgSubscribers: 0, competition: 'low' };
                }

                const videoIds = searchResult.items.map(item => item.id.videoId).join(',');

                // 비디오 상세 정보
                const videoDetails = await fetchYouTubeAPI('videos', {
                    part: 'statistics',
                    id: videoIds
                });

                // 채널 정보
                const channelIds = [...new Set(searchResult.items.map(item => item.snippet.channelId))].join(',');
                const channelDetails = await fetchYouTubeAPI('channels', {
                    part: 'statistics',
                    id: channelIds
                });

                // 통계 계산
                let totalViews = 0;
                let totalSubscribers = 0;

                videoDetails.items.forEach(video => {
                    totalViews += parseInt(video.statistics.viewCount || 0);
                });

                channelDetails.items.forEach(channel => {
                    totalSubscribers += parseInt(channel.statistics.subscriberCount || 0);
                });

                const avgViews = Math.round(totalViews / videoDetails.items.length);
                const avgSubscribers = Math.round(totalSubscribers / channelDetails.items.length);

                // 경쟁 강도 결정 (구독자 수 기반)
                let competition = 'low';
                if (avgSubscribers > 500000) {
                    competition = 'high';
                } else if (avgSubscribers > 100000) {
                    competition = 'medium';
                }

                return {
                    videoCount: searchResult.pageInfo?.totalResults || searchResult.items.length,
                    avgViews,
                    avgSubscribers,
                    competition
                };
            } catch (error) {
                console.error('키워드 분석 오류:', error);
                return { videoCount: 0, avgViews: 0, avgSubscribers: 0, competition: 'low' };
            }
        }

        // 키워드 분석 실행 (병렬 처리 최적화)

                // 연관 키워드 분석 (병렬 처리)
                const keywordsToAnalyze = relatedKeywords.slice(1, 7);

                // 병렬로 모든 키워드 분석
                const analysisPromises = keywordsToAnalyze.map(kw => analyzeKeywordCompetition(kw));
                const analysisResults = await Promise.all(analysisPromises);

                const analyzedKeywords = keywordsToAnalyze.map((kw, i) => ({
                    keyword: kw,
                    ...analysisResults[i],
                    isLongtail: kw.split(' ').length >= 3,
                    score: calculateCompetitionScore(analysisResults[i])
                }));

                // 경쟁 강도 낮은 순으로 정렬
                analyzedKeywords.sort((a, b) => a.score - b.score);

                const longtailKeywords = generateLongtailKeywords(mainKeyword, relatedKeywords);

                // 롱테일 키워드 병렬 분석 (상위 8개)
                const longtailPromises = longtailKeywords.slice(0, 8).map(async lt => {
                    try {
                        const analysis = await analyzeKeywordCompetition(lt);
                        return {
                            keyword: lt,
                            score: 100 - calculateCompetitionScore(analysis), // 추천 점수 (경쟁 낮을수록 높음)
                            competition: analysis.competition
                        };
                    } catch {
                        return { keyword: lt, score: 75, competition: 'low' };
                    }
                });

                const longtailAnalyzed = await Promise.all(longtailPromises);

                // 점수 높은 순으로 정렬
                longtailAnalyzed.sort((a, b) => b.score - a.score);

                longtailContainer.innerHTML = longtailAnalyzed.map(item => `

                statsContainer.innerHTML = `<div class="trend-loading">분석 실패: ${error.message}</div>`;
                if (progressBar) progressBar.style.display = 'none';
            }
        }

        // 복합 경쟁 점수 계산 (0-100, 높을수록 경쟁 심함)
        function calculateCompetitionScore(analysis) {
            const { avgViews, avgSubscribers, videoCount } = analysis;

            // 구독자 기반 점수 (0-40)
            let subScore = 0;
            if (avgSubscribers > 1000000) subScore = 40;
            else if (avgSubscribers > 500000) subScore = 35;
            else if (avgSubscribers > 100000) subScore = 25;
            else if (avgSubscribers > 50000) subScore = 15;
            else if (avgSubscribers > 10000) subScore = 8;
            else subScore = 3;

            // 조회수 기반 점수 (0-35)
            let viewScore = 0;
            if (avgViews > 1000000) viewScore = 35;
            else if (avgViews > 500000) viewScore = 28;
            else if (avgViews > 100000) viewScore = 20;
            else if (avgViews > 50000) viewScore = 12;
            else if (avgViews > 10000) viewScore = 6;
            else viewScore = 2;

            // 영상 수 기반 점수 (0-25)
            let countScore = 0;
            if (videoCount > 1000000) countScore = 25;
            else if (videoCount > 500000) countScore = 20;
            else if (videoCount > 100000) countScore = 15;
            else if (videoCount > 10000) countScore = 10;
            else if (videoCount > 1000) countScore = 5;
            else countScore = 2;

            return Math.min(100, subScore + viewScore + countScore);
        }

        // 프로그레스바 업데이트
        function updateProgress(percent, text) {
            const fill = document.getElementById('progressFill');

        // 롱테일 키워드 생성 (연관 키워드 기반 + 조합)
        function generateLongtailKeywords(keyword, relatedKeywords = []) {
            const longtails = new Set();

            // 1. 연관 키워드 중 3단어 이상인 것 추가
            relatedKeywords.forEach(kw => {
                const wordCount = kw.split(' ').length;
                if (wordCount >= 3) {
                    longtails.add(kw);
                }
            });

            // 2. 연관 키워드 조합으로 롱테일 생성
            relatedKeywords.slice(0, 5).forEach(kw => {
                if (kw !== keyword && kw.length >= 2) {
                    // 키워드 + 연관어 조합
                    if (!kw.toLowerCase().includes(keyword.toLowerCase())) {
                        longtails.add(`${keyword} ${kw}`);
                    }
                }
            });

            // 3. 인기 있는 롱테일 패턴 추가 (연관 키워드와 조합)
            const patterns = ['추천', '비교', '순위', '후기', '방법'];
            relatedKeywords.slice(0, 3).forEach(kw => {
                patterns.forEach(pattern => {
                    if (!kw.includes(pattern)) {
                        longtails.add(`${kw} ${pattern}`);
                    }
                });
            });

            // 4. 기본 롱테일 패턴 (백업)
            if (longtails.size < 8) {
                const backupPatterns = [
                    `${keyword} 하는 법`,
                    `${keyword} 초보자`,
                    `${keyword} 추천`,
                    `${keyword} 비교`,
                    `${keyword} 순위`,
                    `${keyword} 후기`
                ];
                backupPatterns.forEach(p => longtails.add(p));
            }

            return [...longtails].slice(0, 15);
        }

        // 날짜 계산
        function getPublishedAfter(days) {
            const date = new Date();
            date.setDate(date.getDate() - days);
            return date.toISOString();
        }

        // 구독자 수 포맷
        function formatSubscribers(count) {
            if (count >= 1000000) {
                return (count / 1000000).toFixed(1) + 'M';
            } else if (count >= 1000) {
                return (count / 1000).toFixed(1) + 'K';
            }
            return count.toString();
        }

        // 조회수 포맷
        function formatViews(count) {
            if (count >= 100000000) {
                return (count / 100000000).toFixed(1) + '억';
            } else if (count >= 10000) {
                return (count / 10000).toFixed(1) + '만';
            } else if (count >= 1000) {
                return (count / 1000).toFixed(1) + '천';
            }
            return count.toString();
        }

        // ISO 8601 기간을 분:초로 변환
        function formatDuration(isoDuration) {
            const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!match) return '0:00';

            const hours = parseInt(match[1] || 0);
            const minutes = parseInt(match[2] || 0);
            const seconds = parseInt(match[3] || 0);

            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // 기간을 초로 변환 (정렬용)
        function durationToSeconds(isoDuration) {
            const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!match) return 0;

            const hours = parseInt(match[1] || 0);
            const minutes = parseInt(match[2] || 0);
            const seconds = parseInt(match[3] || 0);

            return hours * 3600 + minutes * 60 + seconds;
        }

        // 기간을 분으로 변환 (필터용)
        function durationToMinutes(isoDuration) {
            return durationToSeconds(isoDuration) / 60;
        }

        // 업로드 날짜 포맷
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return '오늘';
            if (days === 1) return '어제';
            if (days < 7) return `${days}일 전`;
            if (days < 30) return `${Math.floor(days / 7)}주 전`;
            if (days < 365) return `${Math.floor(days / 30)}개월 전`;
            return `${Math.floor(days / 365)}년 전`;
        }

        // 정렬 함수
        function sortVideos(column) {
            // 정렬 방향 결정
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            // 헤더 스타일 업데이트
            document.querySelectorAll('.video-table th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            const currentTh = document.querySelector(`th[data-sort="${column}"]`);
            if (currentTh) {
                currentTh.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
            }

            // 정렬 수행
            currentVideos.sort((a, b) => {
                let valA, valB;

                switch (column) {
                    case 'title':
                        valA = a.snippet.title.toLowerCase();
                        valB = b.snippet.title.toLowerCase();
                        break;
                    case 'channel':
                        valA = a.snippet.channelTitle.toLowerCase();
                        valB = b.snippet.channelTitle.toLowerCase();
                        break;
                    case 'subscribers':
                        valA = channelSubscribersMap[a.snippet.channelId] || 0;
                        valB = channelSubscribersMap[b.snippet.channelId] || 0;
                        break;
                    case 'views':
                        valA = parseInt(a.statistics.viewCount || 0);
                        valB = parseInt(b.statistics.viewCount || 0);
                        break;
                    case 'duration':
                        valA = durationToSeconds(a.contentDetails.duration);
                        valB = durationToSeconds(b.contentDetails.duration);
                        break;
                    case 'date':
                        valA = new Date(a.snippet.publishedAt).getTime();
                        valB = new Date(b.snippet.publishedAt).getTime();
                        break;
                    default:
                        return 0;
                }

                if (typeof valA === 'string') {
                    return currentSort.direction === 'asc'
                        ? valA.localeCompare(valB)
                        : valB.localeCompare(valA);
                } else {
                    return currentSort.direction === 'asc'
                        ? valA - valB
                        : valB - valA;
                }
            });

            // 테이블 다시 렌더링
            renderTable();
        }

        // 트렌드 점수 계산 (조회수 / 구독자수)
        function calculateTrendScore(views, subscribers) {
            if (subscribers === 0) return views > 0 ? 100 : 0;
            return (views / subscribers) * 100;
        }

        // 트렌드 차트 렌더링
        function renderTrendChart() {
            const chartContainer = document.getElementById('trendChartContainer');
            const barsArea = document.getElementById('chartBarsArea');
            const yAxis = document.getElementById('chartYAxis');

            if (currentVideos.length === 0) {
                chartContainer.style.display = 'none';
                return;
            }

            // 점수 계산 및 정렬
            const videosWithScore = currentVideos.map(video => {
                const views = parseInt(video.statistics.viewCount || 0);
                const subscribers = channelSubscribersMap[video.snippet.channelId] || 1;
                const score = calculateTrendScore(views, subscribers);
                return { video, score, views, subscribers };
            }).sort((a, b) => b.score - a.score);

            // 최대 점수
            const maxScore = Math.max(...videosWithScore.map(v => v.score), 1);

            // Y축 렌더링
            yAxis.innerHTML = `
                <span>${maxScore.toFixed(1)}</span>
                <span>${(maxScore * 0.75).toFixed(1)}</span>
                <span>${(maxScore * 0.5).toFixed(1)}</span>
                <span>${(maxScore * 0.25).toFixed(1)}</span>
                <span>0</span>
            `;

            // 막대 그래프 렌더링
            barsArea.innerHTML = videosWithScore.map(({ video, score, views, subscribers }) => {
                const heightPercent = (score / maxScore) * 100;
                const videoUrl = `https://www.youtube.com/watch?v=${video.id}`;
                const title = video.snippet.title;
                const shortTitle = title.length > 8 ? title.substring(0, 8) + '...' : title;

            chartContainer.style.display = 'block';

        function toggleFavorite(videoId, button) {
            const video = currentVideos.find(v => v.id === videoId);
            if (!video) return;

            const isFavorite = favorites.some(f => f.id === videoId);

            if (isFavorite) {
                removeFromFavorites(videoId);
                button.classList.remove('active');
                button.querySelector('svg').setAttribute('fill', 'none');
            } else {
                addToFavorites(video);
                button.classList.add('active');
                button.querySelector('svg').setAttribute('fill', 'currentColor');
            }

            renderFavorites();
        }

        // 메인 검색 함수
        async function search() {
            const keyword = document.getElementById('keyword').value.trim();
            if (!keyword) {
                showError('키워드를 입력해주세요.');
                return;
            }

            // 검색 히스토리에 추가
            addToHistory(keyword);

            hideError();

            const loadingContainer = document.getElementById('loadingContainer');
            const resultsContainer = document.getElementById('resultsContainer');

            loadingContainer.style.display = 'block';
            resultsContainer.style.display = 'none';

            // 정렬 상태 초기화
            currentSort = { column: null, direction: 'asc' };
            document.querySelectorAll('.video-table th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });

            try {
                // 연관 키워드 조회
                fetchRelatedKeywords(keyword);

                // 필터 값 가져오기
                const period = parseInt(document.getElementById('period').value);
                const duration = document.getElementById('duration').value;
                const maxSubscribers = document.getElementById('maxSubscribers').value;
                const minViews = parseInt(document.getElementById('minViews').value);
                const maxResults = parseInt(document.getElementById('maxResults').value);
                const regionCode = document.getElementById('regionCode').value;

                // 국가별 언어 매핑
                const regionLanguageMap = {
                    'KR': 'ko', 'US': 'en', 'JP': 'ja', 'GB': 'en', 'DE': 'de',
                    'FR': 'fr', 'CA': 'en', 'AU': 'en', 'IN': 'en', 'BR': 'pt',
                    'TW': 'zh', 'TH': 'th', 'VN': 'vi', 'ID': 'id', 'MX': 'es',
                    'ES': 'es', 'IT': 'it', 'RU': 'ru', 'PH': 'en', 'SG': 'en'
                };
                const relevanceLanguage = regionLanguageMap[regionCode] || 'en';

                // 영상 검색
                const searchParams = {
                    part: 'snippet',
                    q: keyword,
                    type: 'video',
                    order: 'viewCount',
                    publishedAfter: getPublishedAfter(period),
                    maxResults: 50,
                    regionCode: regionCode,
                    relevanceLanguage: relevanceLanguage
                };

                const searchResults = await fetchYouTubeAPI('search', searchParams);

                if (!searchResults.items || searchResults.items.length === 0) {
                    loadingContainer.style.display = 'none';
                    resultsContainer.style.display = 'block';
                    document.getElementById('trendChartContainer').style.display = 'none';
                    currentVideos = [];
                    renderTable();
                    document.getElementById('resultsCount').textContent = '0개';
                    return;
                }

                // 비디오 ID 목록
                const videoIds = searchResults.items.map(item => item.id.videoId).join(',');

                // 비디오 상세 정보 조회
                const videoDetails = await fetchYouTubeAPI('videos', {
                    part: 'snippet,statistics,contentDetails',
                    id: videoIds
                });

                // 채널 ID 목록 (중복 제거)
                const channelIds = [...new Set(videoDetails.items.map(item => item.snippet.channelId))].join(',');

                // 채널 정보 조회
                const channelDetails = await fetchYouTubeAPI('channels', {
                    part: 'statistics',
                    id: channelIds
                });

                // 채널 구독자 수 매핑
                channelSubscribersMap = {};
                channelDetails.items.forEach(channel => {
                    channelSubscribersMap[channel.id] = parseInt(channel.statistics.subscriberCount || 0);
                });

                // 필터링
                let filteredVideos = videoDetails.items.filter(video => {
                    const views = parseInt(video.statistics.viewCount || 0);
                    const minutes = durationToMinutes(video.contentDetails.duration);
                    const subscribers = channelSubscribersMap[video.snippet.channelId] || 0;

                    // 조회수 필터
                    if (views < minViews) return false;

                    // 영상 길이 필터
                    if (duration !== 'any') {
                        if (duration === '30+') {
                            if (minutes < 30) return false;
                        } else if (duration === '0-1') {
                            if (minutes > 1) return false;
                        } else if (duration === '1-10') {
                            if (minutes < 1 || minutes > 10) return false;
                        } else if (duration === '11-20') {
                            if (minutes < 11 || minutes > 20) return false;
                        } else if (duration === '21-30') {
                            if (minutes < 21 || minutes > 30) return false;
                        }
                    }

                    // 구독자 상한 필터
                    if (maxSubscribers !== 'any') {
                        const maxSubs = parseInt(maxSubscribers);
                        if (subscribers > maxSubs) return false;
                    }

                    return true;
                });

                // 결과 수 제한
                currentVideos = filteredVideos.slice(0, maxResults);

                // 결과 표시
                resultsContainer.style.display = 'block';
                document.getElementById('resultsCount').textContent = `${currentVideos.length}개 결과`;
                renderTrendChart();
                renderTable();

            } catch (error) {
                showError(error.message);
            } finally {
                loadingContainer.style.display = 'none';
            }
        }

        // 영상 정보 복사
        function copyVideoInfo(videoId, button) {
            const video = currentVideos.find(v => v.id === videoId);
            if (!video) return;

            const subscribers = channelSubscribersMap[video.snippet.channelId] || 0;
            const views = parseInt(video.statistics.viewCount || 0);
            const duration = formatDuration(video.contentDetails.duration);
            const publishedAt = new Date(video.snippet.publishedAt).toLocaleDateString('ko-KR');
            const videoUrl = `https://www.youtube.com/watch?v=${video.id}`;
            const trendScore = (subscribers > 0 ? (views / subscribers) * 100 : 0).toFixed(2);

            const copyText = `제목: ${video.snippet.title}
채널: ${video.snippet.channelTitle}
구독자: ${formatSubscribers(subscribers)}
조회수: ${formatViews(views)}
영상시간: ${duration}
업로드일: ${publishedAt}
트렌드점수: ${trendScore}
링크: ${videoUrl}`;

            navigator.clipboard.writeText(copyText).then(() => {
                // 버튼 상태 변경
                const originalText = button.innerHTML;
                button.classList.add('copied');
                button.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    완료!
                `;

                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = originalText;
                }, 1500);
            }).catch(err => {
                alert('복사 실패: ' + err.message);
            });
        }

        // 구글 시트로 내보내기
        function exportToGoogleSheets() {
            if (currentVideos.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            // 헤더 행
            const headers = ['제목', '채널명', '구독자수', '조회수', '영상시간', '업로드일', '트렌드점수', '링크'];

            // 데이터 행 생성
            const rows = currentVideos.map(video => {
                const subscribers = channelSubscribersMap[video.snippet.channelId] || 0;
                const views = parseInt(video.statistics.viewCount || 0);
                const duration = formatDuration(video.contentDetails.duration);
                const publishedAt = new Date(video.snippet.publishedAt).toLocaleDateString('ko-KR');
                const trendScore = (subscribers > 0 ? (views / subscribers) * 100 : 0).toFixed(2);
                const videoUrl = `https://www.youtube.com/watch?v=${video.id}`;

                return [
                    video.snippet.title.replace(/\t/g, ' '),
                    video.snippet.channelTitle.replace(/\t/g, ' '),
                    subscribers,
                    views,
                    duration,
                    publishedAt,
                    trendScore,
                    videoUrl
                ];
            });

            // 탭으로 구분된 데이터 생성 (구글 시트 붙여넣기용)
            const tsvData = [headers, ...rows].map(row => row.join('\t')).join('\n');

            // 클립보드에 복사
            navigator.clipboard.writeText(tsvData).then(() => {
                // 새 구글 시트 열기
                const googleSheetUrl = 'https://docs.google.com/spreadsheets/create';
                window.open(googleSheetUrl, '_blank');

                alert('데이터가 클립보드에 복사되었습니다!\n\n새 구글 시트에서 Ctrl+V (또는 Cmd+V)로 붙여넣기 하세요.');
            }).catch(err => {
                // 클립보드 복사 실패 시 CSV 다운로드
                const csvContent = [headers, ...rows].map(row =>
                    row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
                ).join('\n');

                const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `youtube_trend_${new Date().toISOString().slice(0,10)}.csv`;
                link.click();

                alert('CSV 파일이 다운로드됩니다.\n\n구글 드라이브에 업로드하거나\n구글 시트에서 "파일 > 가져오기"를 사용하세요.');
            });
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', () => {
            // 저장된 API 키 불러오기
            const savedApiKey = localStorage.getItem('youtubeApiKey');
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }

            // API 키 변경 시 저장
            document.getElementById('apiKey').addEventListener('change', (e) => {
                localStorage.setItem('youtubeApiKey', e.target.value);
            });

            // 테이블 헤더 클릭 이벤트 (정렬)
            document.querySelectorAll('.video-table th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const sortKey = th.dataset.sort;
                    if (sortKey && currentVideos.length > 0) {
                        sortVideos(sortKey);
                    }
                });
            });

            // 국가 선택 변경 시 트렌드 데이터 갱신
            document.getElementById('regionCode').addEventListener('change', () => {
                loadTrendKeywords();
            });

            // 페이지 로드 시 트렌드 데이터 자동 로드
            loadTrendKeywords();

            // 히스토리 및 즐겨찾기 렌더링
            renderHistory();
            renderFavorites();
        });
    </script>
</body>
</html>
